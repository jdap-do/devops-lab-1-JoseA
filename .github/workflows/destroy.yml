name: Cleanup Student Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STUDENT_SUFFIX: ${{ vars.STUDENT_SUFFIX }}

jobs:
  destroy:
    name: Destroy Student Infrastructure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate student suffix
        shell: bash
        run: |
          if [ -z "$STUDENT_SUFFIX" ]; then
            echo "Error: configura la variable STUDENT_SUFFIX del repositorio."
            exit 1
          fi
          echo "Se eliminarán los recursos del estudiante: $STUDENT_SUFFIX"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run cleanup script
        run: bash scripts/destroy.sh "$STUDENT_SUFFIX"